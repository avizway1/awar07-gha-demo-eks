name: Reusable - Deploy to Amazon EKS

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (staging | production)"
        required: true
        type: string
      aws-region:
        description: "AWS region"
        required: false
        type: string
        default: "ap-south-1"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EKS (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.aws-region }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update kubeconfig for EKS cluster
        run: |
          aws eks update-kubeconfig \
            --region ${{ inputs.aws-region }} \
            --name "${{ secrets.EKS_CLUSTER_NAME }}"

      - name: Deploy new image to EKS
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO_NAME }}:${{ github.sha }}"
          echo "Deploying image: $IMAGE"

          kubectl set image deployment/${{ secrets.EKS_DEPLOYMENT_NAME }} \
            ${{ secrets.EKS_CONTAINER_NAME }}=$IMAGE \
            --namespace=${{ secrets.EKS_NAMESPACE }}

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/${{ secrets.EKS_DEPLOYMENT_NAME }} \
            --namespace=${{ secrets.EKS_NAMESPACE }} \
            --timeout=300s
