apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aviz-demo
  namespace: aviz-demo
spec:
  podSelector:
    matchLabels:
      app: aviz-demo

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow inbound traffic on port 5000 only (from the LoadBalancer / other pods)
    - ports:
        - protocol: TCP
          port: 5000

  egress:
    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS outbound (ECR pulls, AWS APIs, SonarCloud, etc.)
    - ports:
        - protocol: TCP
          port: 443
